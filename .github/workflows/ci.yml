name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
  # release.yml runs these checks before publishing an image.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefixed, so a calling workflow's own group never matches it.
  group: ci-${{ github.ref }}
  # A new push to a pull request supersedes its running checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          ignore: DL3018
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint & Test
        run: make setup-ci ci
        env:
          TZ: Europe/Berlin
